<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B46C1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Symbol - Rounded Square Background -->
  <rect x="20" y="20" width="200" height="200" rx="50" fill="url(#purpleGradient)"/>
  
  <!-- Upward Growth Arrow -->
  <g transform="translate(120, 120)">
    <!-- Arrow shaft -->
    <path d="M 0 60 L 0 -50" 
          stroke="white" 
          stroke-width="16" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Arrow head -->
    <path d="M 0 -60 L -25 -35 L 0 -50 L 25 -35 Z" 
          fill="white"/>
    
    <!-- Base platform -->
    <rect x="-40" y="60" width="80" height="8" rx="4" fill="#10B981" opacity="0.8"/>
  </g>
  
  <!-- Text: LUMKA -->
  <text x="260" y="150" 
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
        font-size="96" 
        font-weight="800" 
        fill="#1E293B"
        letter-spacing="-2">LUMKA</text>
  
  <!-- Tagline: AI Co-Pilot for VAs -->
  <text x="265" y="185" 
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
        font-size="24" 
        font-weight="500" 
        fill="#64748B"
        letter-spacing="0">AI Co-Pilot for VAs</text>
</svg>
